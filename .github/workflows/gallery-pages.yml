name: Publish simulation gallery
on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - 'PROJECT/Results/**'
      - '.github/workflows/gallery-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build and validate selected media
        run: python gallery/build_gallery.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v4
